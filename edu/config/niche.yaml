# Default niche for the local Reels pipeline.
name: science & space facts
audience: general viewers
tone: clear and concrete
length_seconds: 30
# Book search used when the topic does not match an OpenStax title.
openstax_query: astronomy
ollama:
  host: http://127.0.0.1:11434
  model: qwen2.5:7b
sources:
  - wikipedia
  - nasa
  - openstax
  - wikimedia
# Approved videos are spaced on the queue. 1 means one video per day.
cadence_per_day: 1
# Reels send Instagram's is_ai_generated label. If that field is rejected, the caption gains a disclosure line.
ai_disclosure: true
